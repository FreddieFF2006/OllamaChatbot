<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerPoint Extraction - AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        :root {
            --primary-purple: #8b5cf6;
            --dark-purple: #7c3aed;
            --light-purple: #a78bfa;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --bg-light: #faf5ff;
            --border-purple: #ddd6fe;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: none;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.5rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-1px);
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .error-message {
            padding: 2rem;
            text-align: center;
            color: var(--text-light);
        }

        .error-message h2 {
            color: var(--primary-purple);
            margin-bottom: 1rem;
        }

        .error-message p {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            📊 PowerPoint Extraction Tool
        </h1>
        <a href="/" class="back-button">← Back to Chat</a>
    </div>

    <div class="iframe-container">
        <iframe src="http://localhost:5001" id="pptFrame" onload="checkFrameLoad()"></iframe>
    </div>

    <script>
        function checkFrameLoad() {
            // Optional: Add error handling if needed
            console.log('PPT Extraction service loaded');
        }

        // Handle iframe errors
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'IFRAME') {
                const container = document.querySelector('.iframe-container');
                container.innerHTML = `
                    <div class="error-message">
                        <h2>⚠️ Unable to Connect</h2>
                        <p>The PowerPoint Extraction service at <strong>localhost:5001</strong> is not responding.</p>
                        <p>Please make sure the pptx2description service is running.</p>
                        <br>
                        <a href="/" class="back-button">← Back to Chat</a>
                    </div>
                `;
            }
        }, true);
    </script>
</body>
</html>
