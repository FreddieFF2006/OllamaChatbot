<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerPoint Extraction - AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        :root {
            --primary: #1a1a1a;
            --primary-hover: #000000;
            --secondary: #4a4a4a;
            --accent: #6b6b6b;
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --bg-tertiary: #f5f5f5;
            --bg-quaternary: #ebebeb;
            --border: #d4d4d4;
            --border-light: #e8e8e8;
            --border-lighter: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #525252;
            --text-tertiary: #8a8a8a;
            --text-quaternary: #a3a3a3;
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            background: var(--bg-primary);
            padding: 1rem 2rem;
            box-shadow: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .back-button {
            background: var(--primary);
            color: white;
            border: 1px solid var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875rem;
            text-decoration: none;
            transition: background 0.15s;
            font-weight: 400;
        }

        .back-button:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .error-message {
            padding: 2rem;
            text-align: center;
            color: var(--text-light);
        }

        .error-message h2 {
            color: var(--navy-blue);
            margin-bottom: 1rem;
        }

        .error-message p {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            📊 PowerPoint Extraction Tool
        </h1>
        <a href="/" class="back-button">← Back to Chat</a>
    </div>

    <div class="iframe-container">
        <iframe src="http://localhost:5001" id="pptFrame" onload="checkFrameLoad()"></iframe>
    </div>

    <script>
        function checkFrameLoad() {
            // Optional: Add error handling if needed
            console.log('PPT Extraction service loaded');
        }

        // Handle iframe errors
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'IFRAME') {
                const container = document.querySelector('.iframe-container');
                container.innerHTML = `
                    <div class="error-message">
                        <h2>⚠️ Unable to Connect</h2>
                        <p>The PowerPoint Extraction service at <strong>localhost:5001</strong> is not responding.</p>
                        <p>Please make sure the pptx2description service is running.</p>
                        <br>
                        <a href="/" class="back-button">← Back to Chat</a>
                    </div>
                `;
            }
        }, true);
    </script>
</body>
</html>
